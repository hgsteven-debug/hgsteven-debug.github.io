<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>天空飛馳 Sky Roadster</title>
<script>
(function () {
  var target = "/roadster-sky-race/" + location.search + location.hash;
  try { location.replace(target); } catch (e) {}
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/roadster-sky-race/"></noscript>
</head>
<body>
<p><a id="go" href="/roadster-sky-race/">進入天空飛馳 Sky Roadster</a></p>
<script>
(function () {
  var a = document.getElementById("go");
  if (a) a.href = "/roadster-sky-race/" + location.search + location.hash;
  var q = "";
  try { q = new URLSearchParams(location.search).get("lang") || ""; } catch (e) {}
  var nav = (navigator.language || "").toLowerCase();
  var id = (q || nav).toLowerCase();
  var label = "進入天空飛馳 Sky Roadster";
  if (id.indexOf("fr") === 0) label = "Entrer dans Sky Roadster";
  else if (id.indexOf("ja") === 0) label = "スカイロードスターへ";
  else if (id.indexOf("ko") === 0) label = "스카이 로드스터로";
  else if (id.indexOf("en") === 0) label = "Enter Sky Roadster";
  if (a) a.textContent = label;
})();
</script>
</body>
</html>
